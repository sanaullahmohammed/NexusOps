version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      aspire-all:
        patterns:
          - "Aspire.*"
      dotnet-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "Aspire.*"
    ignore:
      - dependency-name: "Aspire.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "MassTransit*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native compiler port; typescript-eslint still peers
      # "typescript": ">=4.8.4 <6.1.0", so `npm ci` fails ERESOLVE on any 7.x.
      # Drop this entry once typescript-eslint ships TypeScript 7 support.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
