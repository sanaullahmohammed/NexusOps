name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NexusOps.deployable.slnf

      - name: Build
        run: dotnet build NexusOps.deployable.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test NexusOps.deployable.slnf --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Validate evaluation dataset
        run: dotnet run --project NexusOps.Evaluation --configuration Release --no-build -- --validate-only

      # NexusOps.IntegrationTests is deliberately excluded from NexusOps.deployable.slnf (its actual
      # test run needs Docker and is gated to push-to-master only, below) -- but a PR that breaks its
      # *compilation* must still be caught here, or it goes green on the PR and only fails once
      # merged to master.
      - name: Build integration tests (compile-only, no Docker)
        run: dotnet build NexusOps.IntegrationTests/NexusOps.IntegrationTests.csproj --configuration Release

  # Aspire.Hosting.Testing integration tests boot real RabbitMQ/PostgreSQL containers and four
  # WorkflowOrchestrator-side processes -- gated to push-to-master only (CLAUDE.md's own documented
  # policy: "isolate them in a job gated to push to master only, not fork PRs"), not pull_request, so
  # a slow image pull or a missed health window never fails a PR (fork PRs also can't be trusted with
  # container/Docker access the same way a same-repo push can).
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: dotnet
    # This job boots real containers and four spawned processes; a fixture that hangs would
    # otherwise burn the default 360-minute job limit before GitHub reclaims the runner.
    # WorkflowOrchestratorFixture's own StartupTimeout is 5 minutes and the suite runs in ~1,
    # so 30 is generous headroom for a cold runner pulling images, not a tight bound.
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NexusOps.IntegrationTests/NexusOps.IntegrationTests.csproj

      - name: Build
        run: dotnet build NexusOps.IntegrationTests/NexusOps.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test NexusOps.IntegrationTests/NexusOps.IntegrationTests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  notification-service:
    name: notification-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: notification-service/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck
